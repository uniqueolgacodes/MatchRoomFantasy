<!--
  Confirm-signup email template. Supabase's default template is
  effectively unstyled plain text — this replaces it with something
  on-brand, using an HTML table layout and inline styles because
  that's what actually survives Gmail/Outlook/Apple Mail's CSS
  stripping, rather than a modern flexbox/class-based layout that
  would just get gutted in transit.

  {{ .ConfirmationURL }} is Supabase's template variable — do not
  rename it.
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirm your email</title>
  </head>
  <body style="margin:0; padding:0; background-color:#0a0a0a; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#0a0a0a; padding:40px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px; width:100%; background-color:#141414; border-radius:16px; overflow:hidden; border:1px solid #262626;">
            <tr>
              <td style="padding:36px 32px 8px 32px; text-align:center;">
                <div style="display:inline-block; width:56px; height:56px; line-height:56px; border-radius:14px; background-color:rgba(22,163,74,0.15); font-size:26px;">⚽</div>
              </td>
            </tr>
            <tr>
              <td style="padding:16px 32px 0 32px; text-align:center;">
                <h1 style="margin:0; font-size:22px; line-height:1.3; color:#ffffff; font-weight:700;">
                  Confirm your email
                </h1>
                <p style="margin:10px 0 0 0; font-size:14px; line-height:1.6; color:rgba(255,255,255,0.6);">
                  One tap and you're in — free matchday prediction rooms for EPL fans, no cash involved, ever.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:28px 32px 8px 32px; text-align:center;">
                <a
                  href="{{ .ConfirmationURL }}"
                  style="display:inline-block; background-color:#16a34a; color:#ffffff; font-size:15px; font-weight:600; text-decoration:none; padding:13px 28px; border-radius:10px;"
                >
                  Confirm email address
                </a>
              </td>
            </tr>
            <tr>
              <td style="padding:20px 32px 0 32px; text-align:center;">
                <p style="margin:0; font-size:12px; line-height:1.6; color:rgba(255,255,255,0.35);">
                  Didn't sign up for MatchRoom? You can safely ignore this email.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:28px 32px 32px 32px; text-align:center; border-top:1px solid #262626; margin-top:24px;">
                <p style="margin:20px 0 0 0; font-size:11px; color:rgba(255,255,255,0.25);">
                  MatchRoom Fantasy — Match Points have no cash value and can't be bought or cashed out.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
